<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>GHOST‑CORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body id="main-body" class="mode-one">

<div class="mirror-wrapper">
    <div id="container">

        <!-- PAGE 1 — NAME + CLOCK + STATS -->
        <section id="page-1" class="page">
            <div id="p1-name" class="p1-title">GHOST‑CORE</div>
            <div id="p1-time" class="p1-time">00:00:00</div>
            <div id="p1-stats" class="p1-stats">CPU: 0% | RAM: 0%</div>
        </section>

        <!-- PAGE 2 — BIG CLOCK -->
        <section id="page-2" class="page">
            <div id="p2-time" class="p2-time">00:00:00</div>
        </section>

        <!-- PAGE 3 — TERMINAL VIEW -->
        <section id="page-3" class="page">
            <div class="console-text">
                > SYSTEM STATUS: ONLINE<br>
                > HOST: <span id="p3-name">...</span><br>
                > TIME: <span id="p3-time">...</span><br>
                > <span id="p3-cpu">...</span><br>
                > <span id="p3-ram">...</span>
            </div>
        </section>

        <!-- PAGE 4 — MEDIA PLAYER -->
        <section id="page-4" class="page">
            <div id="media-container"></div>
        </section>

    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
