<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>GHOST‑CORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body id="main-body" class="mode-one">

<div class="mirror-wrapper">
    <div id="container">

        <!-- PAGE 1 — NAME + CLOCK + STATS -->
        <section id="page-1" class="page">
            <div id="p1-name" class="p1-title">GHOST‑CORE</div>
            <div id="p1-time" class="p1-time">00:00:00</div>
            <div id="p1-stats" class="p1-stats">CPU: 0% | RAM: 0%</div>
        </section>

        <!-- PAGE 2 — BIG CLOCK -->
        <section id="page-2" class="page">
            <div id="p2-time" class="p2-time">00:00:00</div>
        </section>

        <!-- PAGE 3 — MONITORING DASHBOARD -->
        <section id="page-3" class="page">

            <div class="p3-header">
                <span id="p3-name">GHOST-CORE</span>
                <div class="p3-header-time">
                    <span id="p3-date">—</span>
                    <span id="p3-clock">—</span>
                </div>
            </div>

            <div class="p3-grid">
                <div class="p3-card">
                    <div class="p3-label">CPU</div>
                    <div id="p3-cpu-val" class="p3-value">0%</div>
                    <div class="p3-bar-bg"><div id="p3-cpu-bar" class="p3-bar"></div></div>
                </div>
                <div class="p3-card">
                    <div class="p3-label">RAM</div>
                    <div id="p3-ram-val" class="p3-value">0%</div>
                    <div class="p3-bar-bg"><div id="p3-ram-bar" class="p3-bar"></div></div>
                </div>
                <div class="p3-card">
                    <div class="p3-label">TEMP</div>
                    <div id="p3-temp-val" class="p3-value">0°C</div>
                    <div class="p3-bar-bg"><div id="p3-temp-bar" class="p3-bar"></div></div>
                </div>
                <div class="p3-card">
                    <div class="p3-label">DISK</div>
                    <div id="p3-disk-val" class="p3-value">0%</div>
                    <div class="p3-bar-bg"><div id="p3-disk-bar" class="p3-bar"></div></div>
                </div>
            </div>

            <div class="p3-footer">
                <span>UPTIME: <span id="p3-uptime">—</span></span>
                <span class="p3-status">&#9679; ONLINE</span>
                <span>IP: <span id="p3-ip">—</span></span>
            </div>

        </section>

        <!-- PAGE 4 — AMBIENT MEDIA + STATS SIDEBAR -->
        <section id="page-4" class="page">

            <div id="p4-media-panel">
                <div id="p4-media"></div>
            </div>

            <div id="p4-stats-panel">
                <div id="p4-time">00:00:00</div>

                <div class="p4-metric">
                    <div class="p4-metric-row">
                        <span class="p4-mlabel">CPU</span>
                        <span id="p4-cpu-val" class="p4-mval">0%</span>
                    </div>
                    <div class="p4-bar-bg"><div id="p4-cpu-bar" class="p4-bar"></div></div>
                </div>

                <div class="p4-metric">
                    <div class="p4-metric-row">
                        <span class="p4-mlabel">RAM</span>
                        <span id="p4-ram-val" class="p4-mval">0%</span>
                    </div>
                    <div class="p4-bar-bg"><div id="p4-ram-bar" class="p4-bar"></div></div>
                </div>

                <div class="p4-metric">
                    <div class="p4-metric-row">
                        <span class="p4-mlabel">TEMP</span>
                        <span id="p4-temp-val" class="p4-mval">0°C</span>
                    </div>
                    <div class="p4-bar-bg"><div id="p4-temp-bar" class="p4-bar"></div></div>
                </div>

                <div id="p4-uptime">—</div>
            </div>

        </section>

        <!-- PAGE 5 — YOUTUBE FULLSCREEN -->
        <section id="page-5" class="page">
            <div id="p5-media"></div>
        </section>

    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
